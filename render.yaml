# Render Blueprint: the API (Docker) and the web app (static site).
# Secrets marked `sync: false` are asked for once, when the Blueprint is created.
# Prices are refreshed by GitHub Actions (.github/workflows/nightly.yml), which is
# free; Render cron jobs have a monthly minimum charge.
services:
  - type: web
    name: cartwise-api
    runtime: docker
    region: frankfurt
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: LLM_PROVIDER
        value: gemini
      - key: CORS_ORIGIN_REGEX
        value: ^https://cartwise[a-z0-9-]*\.onrender\.com$
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: DATA_DIR
        value: /tmp/cartwise-data

  - type: web
    name: cartwise
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Render picks the subdomain (the plain names were taken); this is the API's.
      - key: VITE_API_BASE_URL
        value: https://cartwise-api-mc5x.onrender.com/api
