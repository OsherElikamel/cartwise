name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cartwise_user
          POSTGRES_PASSWORD: cartwise_password
          POSTGRES_DB: cartwise_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U cartwise_user -d cartwise_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://cartwise_user:cartwise_password@localhost:5432/cartwise_test
      TEST_DATABASE_URL: postgresql+psycopg://cartwise_user:cartwise_password@localhost:5432/cartwise_test
      JWT_SECRET_KEY: ci-secret-key-that-is-at-least-32-bytes-long
      # Tests swap in a fake LLM; the key only satisfies config validation.
      GEMINI_API_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Migrations apply cleanly to an empty database
        run: alembic upgrade head && alembic downgrade base
      - run: pytest -v
