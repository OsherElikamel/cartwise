name: Nightly prices

# Refreshes branch lists, prunes abandoned branches, loads today's prices and
# cleans the download cache, against the production database. Free on GitHub
# Actions (Render cron jobs have a monthly minimum).
#
# Shufersal's site sometimes stalls when called from GitHub's US servers, so two
# catch-up runs later in the day reload only the branches the morning run missed.
#
# Run it by hand with "bootstrap" once, on a fresh database: it loads the city
# list and the four demo branches guests compare on.

on:
  schedule:
    - cron: "30 2 * * *"  # 05:30 in Israel (summer time), after the chains publish
    - cron: "0 11,17 * * *"  # catch-up: branches still not loaded today
  workflow_dispatch:
    inputs:
      bootstrap:
        description: "First run on a fresh database: load cities and the demo branches"
        type: boolean
        default: false

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Ingestion makes no AI calls and issues no tokens; these only satisfy config validation.
      JWT_SECRET_KEY: ingestion-job-issues-no-tokens
      GEMINI_API_KEY: ingestion-job-makes-no-ai-calls
      DATA_DIR: /tmp/cartwise-data
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - name: Bootstrap (cities + demo branches)
        if: ${{ inputs.bootstrap }}
        # Every step runs even if one fails (one chain's site being unreachable
        # shouldn't block the others); the step still fails at the end if any did.
        run: |
          failed=0
          python -m app.ingestion.run stores || failed=1
          python -m app.ingestion.run localities || failed=1
          for branch in "rami-levy 709" "shufersal 92" "yohananof 5" "osher-ad 9"; do
            python -m app.ingestion.run track $branch --demo || failed=1
          done
          exit $failed
      - name: Nightly refresh
        if: ${{ !cancelled() && github.event.schedule != '0 11,17 * * *' }}
        run: python -m app.ingestion.run nightly
      - name: Catch-up (branches the last run missed)
        if: ${{ github.event.schedule == '0 11,17 * * *' }}
        run: python -m app.ingestion.run prices --stale-hours 12
